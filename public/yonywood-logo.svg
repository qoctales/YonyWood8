<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 1520 490" width="1520" height="490" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="90" width="1520" height="490" fill="#ffffff"/>
  <!-- Ligne de base y=400 | hauteur x y=270 | hauteur capitales y=170 | trait 18 -->
  <g fill="none" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#B8421D">
      <!-- Y majuscule = même dessin que le y minuscule, pied sur la ligne de base -->
      <path d="M80,140 V205 A65,65 0 0 0 210,205 V140"/>
      <path d="M210,205 V370 A30,30 0 0 1 180,400 H80"/>
      <!-- o -->
      <circle cx="315" cy="335" r="65"/>
      <!-- n -->
      <path d="M420,400 V335 A65,65 0 0 1 550,335 V400"/>
      <!-- y minuscule -->
      <path d="M590,270 V335 A65,65 0 0 0 720,335 V270"/>
      <path d="M720,335 V500 A30,30 0 0 1 690,530 H590"/>
    </g>
    <g stroke="#111111">
      <!-- W : deux cuvettes de la largeur du n (130), pic central à mi-hauteur -->
      <path d="M775,170 V335 A65,65 0 0 0 905,335 A65,65 0 0 0 1035,335 V170"/>
      <path d="M905,335 V285"/>
      <!-- Meuble = les deux "o" (écart égal de 35 avec le W et avec le D) -->
      <rect x="1088" y="270" width="190" height="130" rx="30"/>
      <path d="M1183,270 V400"/>
      <path d="M1118,400 L1098,440 M1248,400 L1268,440"/>
      <!-- D majuscule -->
      <path d="M1331,270 H1366 A75,65 0 0 1 1366,400 H1331 Z"/>
    </g>
  </g>
  <g fill="#111111">
    <circle cx="1153" cy="335" r="10"/>
    <circle cx="1213" cy="335" r="10"/>
  </g>
</svg>
