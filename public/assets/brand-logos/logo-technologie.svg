<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradTech" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0b0a26"/>
      <stop offset="100%" stop-color="#030212"/>
    </radialGradient>
    <linearGradient id="quantumCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="neonCore" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glowTech" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#818cf8" flood-opacity="0.45"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bgGradTech)" stroke="#818cf8" stroke-width="6" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Emblème technologie, IA & quantique : processeur neuronal fractal & prisme optique -->
  <g filter="url(#glowTech)">
    <!-- Anneau hexagonal fractal extérieur -->
    <polygon points="256,104 388,180 388,332 256,408 124,332 124,180" fill="none" stroke="url(#quantumCyan)" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Anneau hexagonal intérieur tourné à 30 degrés -->
    <polygon points="256,134 362,195 362,317 256,378 150,317 150,195" fill="none" stroke="url(#neonCore)" stroke-width="3" stroke-dasharray="14 8" stroke-linejoin="round"/>

    <!-- Lignes de bus optique vers le noyau -->
    <line x1="256" y1="104" x2="256" y2="190" stroke="url(#quantumCyan)" stroke-width="4"/>
    <line x1="388" y1="180" x2="313" y2="223" stroke="url(#quantumCyan)" stroke-width="4"/>
    <line x1="388" y1="332" x2="313" y2="289" stroke="url(#quantumCyan)" stroke-width="4"/>
    <line x1="256" y1="408" x2="256" y2="322" stroke="url(#quantumCyan)" stroke-width="4"/>
    <line x1="124" y1="332" x2="199" y2="289" stroke="url(#quantumCyan)" stroke-width="4"/>
    <line x1="124" y1="180" x2="199" y2="223" stroke="url(#quantumCyan)" stroke-width="4"/>

    <!-- Noyau quantique central avec cube isométrique minimaliste -->
    <polygon points="256,204 300,229 300,283 256,308 212,283 212,229" fill="url(#quantumCyan)"/>
    <polygon points="256,204 300,229 256,256 212,229" fill="#e0f2fe" opacity="0.9"/>
    <polygon points="256,256 300,229 300,283 256,308" fill="url(#neonCore)" opacity="0.8"/>

    <!-- Micro-nœuds aux sommets -->
    <circle cx="256" cy="104" r="8" fill="#38bdf8"/>
    <circle cx="388" cy="180" r="8" fill="#818cf8"/>
    <circle cx="388" cy="332" r="8" fill="#c084fc"/>
    <circle cx="256" cy="408" r="8" fill="#ec4899"/>
    <circle cx="124" cy="332" r="8" fill="#818cf8"/>
    <circle cx="124" cy="180" r="8" fill="#38bdf8"/>
  </g>
</svg>
