<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradHealth" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#01140f"/>
    </radialGradient>
    <linearGradient id="emeraldHeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldLotus" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glowHealth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#10b981" flood-opacity="0.45"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bgGradHealth)" stroke="#10b981" stroke-width="6" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Emblème santé, pharmacopée & bien-être : croix botanique équilibrée & feuille sacrée de vie -->
  <g filter="url(#glowHealth)">
    <!-- Croix de santé harmonieuse aux branches végétales arrondies -->
    <path d="M226,110 L286,110 C296,110 304,118 304,128 L304,208 L384,208 C394,208 402,216 402,226 L402,286 C402,296 394,304 384,304 L304,304 L304,384 C304,394 296,402 286,402 L226,402 C216,402 208,394 208,384 L208,304 L128,304 C118,304 110,296 110,286 L110,226 C110,216 118,208 128,208 L208,208 L208,128 C208,118 216,110 226,110 Z" fill="none" stroke="url(#emeraldHeal)" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Deux feuilles médicinales entrecroisées en cœur de fleur de lotus -->
    <path d="M256,150 C290,195 320,240 320,290 C320,335 292,365 256,365 C220,365 192,335 192,290 C192,240 222,195 256,150 Z" fill="url(#emeraldHeal)"/>

    <!-- Nervure centrale lumineuse de la feuille -->
    <path d="M256,160 L256,355" stroke="url(#goldLotus)" stroke-width="4" stroke-linecap="round"/>
    <path d="M256,220 C272,210 286,220 294,235" stroke="url(#goldLotus)" stroke-width="3" stroke-linecap="round"/>
    <path d="M256,220 C240,210 226,220 218,235" stroke="url(#goldLotus)" stroke-width="3" stroke-linecap="round"/>
    <path d="M256,270 C276,260 292,272 300,290" stroke="url(#goldLotus)" stroke-width="3" stroke-linecap="round"/>
    <path d="M256,270 C236,260 220,272 212,290" stroke="url(#goldLotus)" stroke-width="3" stroke-linecap="round"/>

    <!-- Goutte d'élixir au sommet -->
    <circle cx="256" cy="135" r="7" fill="#fef08a"/>
  </g>
</svg>
