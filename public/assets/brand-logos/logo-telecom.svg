<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradTel" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4a044e"/>
      <stop offset="60%" stop-color="#240227"/>
      <stop offset="100%" stop-color="#0e010f"/>
    </radialGradient>
    <linearGradient id="telecomGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="fiberLight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="60%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="glowTel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#ec4899" flood-opacity="0.45"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bgGradTel)" stroke="#ec4899" stroke-width="6" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Emblème télécom & connectivité : ondes de transmission 360° et boucle orbitale infinie -->
  <g filter="url(#glowTel)">
    <!-- Onde orbitale 1 (grand arc supérieur) -->
    <path d="M126,206 A150,150 0 0,1 386,206" fill="none" stroke="url(#telecomGlow)" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Onde orbitale 2 (arc moyen) -->
    <path d="M166,236 A105,105 0 0,1 346,236" fill="none" stroke="url(#telecomGlow)" stroke-width="8" stroke-linecap="round"/>

    <!-- Onde orbitale 3 (arc intérieur) -->
    <path d="M206,266 A60,60 0 0,1 306,266" fill="none" stroke="url(#fiberLight)" stroke-width="6" stroke-linecap="round"/>

    <!-- Antenne relais sculpturale / balise nodale émettrice -->
    <path d="M256,120 L272,340 L240,340 Z" fill="url(#telecomGlow)"/>
    <path d="M220,380 C235,350 277,350 292,380 L310,400 L202,400 Z" fill="url(#telecomGlow)"/>

    <!-- Noyau d'émission pulsant -->
    <circle cx="256" cy="120" r="24" fill="url(#fiberLight)"/>
    <circle cx="256" cy="120" r="14" fill="#ffffff"/>
    <circle cx="256" cy="120" r="6" fill="#ec4899"/>

    <!-- Arcs de résonance inverses inférieurs (diffusion mondiale) -->
    <path d="M146,360 A130,130 0 0,0 366,360" fill="none" stroke="url(#telecomGlow)" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 12"/>
  </g>
</svg>
