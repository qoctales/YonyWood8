<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradEnerg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="60%" stop-color="#1c0a02"/>
      <stop offset="100%" stop-color="#0a0300"/>
    </radialGradient>
    <linearGradient id="sunPlasma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <filter id="glowEnerg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f97316" flood-opacity="0.45"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bgGradEnerg)" stroke="#f59e0b" stroke-width="6" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Emblème énergie & solaire : turbine hélios cinétique et anneaux d'énergie pure -->
  <g filter="url(#glowEnerg)">
    <!-- Anneau orbital externe segmenté -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#sunPlasma)" stroke-width="6" stroke-dasharray="24 16" stroke-linecap="round"/>
    
    <!-- 8 pales solaires aérodynamiques en rotation vortex -->
    <path d="M256,110 C272,160 268,205 256,236 C248,198 238,155 256,110 Z" fill="url(#sunPlasma)"/>
    <path d="M359,153 C335,199 308,228 277,247 C289,210 299,170 359,153 Z" fill="url(#sunPlasma)"/>
    <path d="M402,256 C352,272 307,268 276,256 C314,248 357,238 402,256 Z" fill="url(#sunPlasma)"/>
    <path d="M359,359 C313,335 284,308 265,277 C302,289 342,299 359,359 Z" fill="url(#sunPlasma)"/>
    <path d="M256,402 C240,352 244,307 256,276 C264,314 274,357 256,402 Z" fill="url(#sunPlasma)"/>
    <path d="M153,359 C177,313 204,284 235,265 C223,302 213,342 153,359 Z" fill="url(#sunPlasma)"/>
    <path d="M110,256 C160,240 205,244 236,256 C198,264 155,274 110,256 Z" fill="url(#sunPlasma)"/>
    <path d="M153,153 C199,177 228,204 247,235 C210,223 170,213 153,153 Z" fill="url(#sunPlasma)"/>

    <!-- Disque incandescent central -->
    <circle cx="256" cy="256" r="44" fill="url(#sunPlasma)"/>
    <circle cx="256" cy="256" r="24" fill="#ffffff" opacity="0.95"/>
    <circle cx="256" cy="256" r="10" fill="#f59e0b"/>
  </g>
</svg>
