<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradText" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="60%" stop-color="#14072b"/>
      <stop offset="100%" stop-color="#070210"/>
    </radialGradient>
    <linearGradient id="silkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="royalIndigo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <filter id="glowText" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#a855f7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bgGradText)" stroke="#c084fc" stroke-width="6" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Emblème mode, tissage d'art & haute couture : ruban de Möbius entrelacé & aiguille d'or -->
  <g filter="url(#glowText)">
    <!-- Boucle de tissage trame (ruban infini de soie torsadé) -->
    <path d="M160,256 C160,180 220,130 290,160 C360,190 360,320 290,350 C220,380 160,330 160,256 Z" fill="none" stroke="url(#royalIndigo)" stroke-width="22" stroke-linecap="round"/>
    
    <!-- Deuxième boucle entrelacée (chaîne de tissage or) -->
    <path d="M352,256 C352,180 292,130 222,160 C152,190 152,320 222,350 C292,380 352,330 352,256 Z" fill="none" stroke="url(#silkGold)" stroke-width="14" stroke-linecap="round"/>

    <!-- Aiguille de tissage stylisée traversant le centre -->
    <path d="M256,90 L270,390 C270,410 242,410 242,390 L256,90 Z" fill="url(#silkGold)"/>

    <!-- Chas de l'aiguille royal -->
    <ellipse cx="256" cy="140" rx="5" ry="24" fill="#14072b" stroke="url(#silkGold)" stroke-width="3"/>

    <!-- Points d'ornement couture -->
    <circle cx="256" cy="80" r="8" fill="#fef08a"/>
    <circle cx="256" cy="425" r="7" fill="#c084fc"/>
  </g>
</svg>
