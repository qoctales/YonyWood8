<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradAudio" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="60%" stop-color="#1e053a"/>
      <stop offset="100%" stop-color="#0a0114"/>
    </radialGradient>
    <linearGradient id="sonicViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="neonPulse" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <filter id="glowAudio" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bgGradAudio)" stroke="#8b5cf6" stroke-width="6" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Emblème musique, son & acoustique : résonateur harmonique & ondes sonores 360° -->
  <g filter="url(#glowAudio)">
    <!-- Onde acoustique circulaire 1 (anneau externe) -->
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#sonicViolet)" stroke-width="6" stroke-dasharray="32 16" stroke-linecap="round"/>
    
    <!-- Onde acoustique circulaire 2 (anneau médian) -->
    <circle cx="256" cy="256" r="110" fill="none" stroke="url(#neonPulse)" stroke-width="7" stroke-dasharray="20 12" stroke-linecap="round"/>

    <!-- Barres d'égalisation radiales harmoniques à 12 directions (rythme et onde) -->
    <line x1="256" y1="90" x2="256" y2="135" stroke="url(#sonicViolet)" stroke-width="8" stroke-linecap="round"/>
    <line x1="339" y1="112" x2="316" y2="152" stroke="url(#sonicViolet)" stroke-width="8" stroke-linecap="round"/>
    <line x1="399" y1="173" x2="360" y2="195" stroke="url(#sonicViolet)" stroke-width="8" stroke-linecap="round"/>
    <line x1="422" y1="256" x2="377" y2="256" stroke="url(#sonicViolet)" stroke-width="8" stroke-linecap="round"/>
    <line x1="399" y1="339" x2="360" y2="316" stroke="url(#sonicViolet)" stroke-width="8" stroke-linecap="round"/>
    <line x1="339" y1="399" x2="316" y2="360" stroke="url(#sonicViolet)" stroke-width="8" stroke-linecap="round"/>
    <line x1="256" y1="422" x2="256" y2="377" stroke="url(#sonicViolet)" stroke-width="8" stroke-linecap="round"/>
    <line x1="173" y1="399" x2="195" y2="360" stroke="url(#sonicViolet)" stroke-width="8" stroke-linecap="round"/>
    <line x1="112" y1="339" x2="152" y2="316" stroke="url(#sonicViolet)" stroke-width="8" stroke-linecap="round"/>
    <line x1="90" y1="256" x2="135" y2="256" stroke="url(#sonicViolet)" stroke-width="8" stroke-linecap="round"/>
    <line x1="112" y1="173" x2="152" y2="195" stroke="url(#sonicViolet)" stroke-width="8" stroke-linecap="round"/>
    <line x1="173" y1="112" x2="195" y2="152" stroke="url(#sonicViolet)" stroke-width="8" stroke-linecap="round"/>

    <!-- Membrane de haut-parleur / diaphragme acoustique central -->
    <circle cx="256" cy="256" r="48" fill="url(#sonicViolet)"/>
    <circle cx="256" cy="256" r="30" fill="#1e053a"/>
    <circle cx="256" cy="256" r="14" fill="url(#neonPulse)"/>
    <circle cx="256" cy="256" r="6" fill="#ffffff"/>
  </g>
</svg>
