<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradMob" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="60%" stop-color="#0a122c"/>
      <stop offset="100%" stop-color="#030612"/>
    </radialGradient>
    <linearGradient id="cobaltSpeed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cyanVector" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glowMob" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#3b82f6" flood-opacity="0.45"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bgGradMob)" stroke="#3b82f6" stroke-width="6" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Emblème transport, mobilité décarbonée & vitesse : deux rails véloces convergents & flèche vectorielle -->
  <g filter="url(#glowMob)">
    <!-- Circuit de vitesse orbital profilé -->
    <ellipse cx="256" cy="256" rx="160" ry="85" fill="none" stroke="url(#cobaltSpeed)" stroke-width="12" stroke-linecap="round" transform="rotate(-25 256 256)"/>
    
    <!-- Voie aérodynamique haute vitesse intérieure -->
    <ellipse cx="256" cy="256" rx="120" ry="55" fill="none" stroke="url(#cyanVector)" stroke-width="6" stroke-dasharray="24 16" transform="rotate(-25 256 256)"/>

    <!-- Flèche vectorielle de pointe (étrave de train à sustentation / bolide futuriste) -->
    <path d="M210,140 L380,210 L330,240 L270,215 L230,285 L180,270 Z" fill="url(#cyanVector)"/>
    <path d="M150,220 L310,290 L260,320 L210,295 L170,365 L120,350 Z" fill="url(#cobaltSpeed)"/>

    <!-- Point focal de propulsion avant -->
    <circle cx="380" cy="210" r="8" fill="#ffffff"/>
  </g>
</svg>
