<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradBank" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#083344"/>
      <stop offset="60%" stop-color="#041f2a"/>
      <stop offset="100%" stop-color="#010d12"/>
    </radialGradient>
    <linearGradient id="fintechCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="vaultGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="glowBank" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0ea5e9" flood-opacity="0.45"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bgGradBank)" stroke="#0ea5e9" stroke-width="6" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Emblème banque, fintech & paiement sécurisé : losange cryptographique & anneaux de coffre-fort -->
  <g filter="url(#glowBank)">
    <!-- Anneau hexagonal bancaire moderne -->
    <path d="M256,110 L382,183 L382,329 L256,402 L130,329 L130,183 Z" fill="none" stroke="url(#fintechCyan)" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Deux hexagones entrelacés formant un bouclier de transaction cryptée -->
    <path d="M256,140 L356,198 L356,314 L256,372 L156,314 L156,198 Z" fill="none" stroke="url(#vaultGold)" stroke-width="4" stroke-dasharray="16 10" stroke-linejoin="round"/>

    <!-- Losange diamant central de valeur & solvabilité -->
    <polygon points="256,170 330,256 256,342 182,256" fill="url(#fintechCyan)"/>
    <polygon points="256,170 330,256 256,256 182,256" fill="#ecfeff" opacity="0.85"/>
    <polygon points="256,256 330,256 256,342 182,256" fill="url(#vaultGold)" opacity="0.9"/>

    <!-- Nœud de sécurité au centre exact -->
    <circle cx="256" cy="256" r="14" fill="#ffffff"/>
    <circle cx="256" cy="256" r="6" fill="#0369a1"/>

    <!-- Orbes de transaction aux 4 sommets cardinaux -->
    <circle cx="256" cy="110" r="9" fill="#22d3ee"/>
    <circle cx="382" cy="256" r="9" fill="#fbbf24"/>
    <circle cx="256" cy="402" r="9" fill="#22d3ee"/>
    <circle cx="130" cy="256" r="9" fill="#fbbf24"/>
  </g>
</svg>
