<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradResort" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="60%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#021717"/>
    </radialGradient>
    <linearGradient id="lagoonTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="45%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="oasisGold" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glowResort" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#14b8a6" flood-opacity="0.45"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bgGradResort)" stroke="#14b8a6" stroke-width="6" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Emblème hôtellerie, écotourisme & retraite d'exception : croissant d'oasis, vague lacustre & étoile polaire -->
  <g filter="url(#glowResort)">
    <!-- Croissant de lune / lagune protectrice enveloppante -->
    <path d="M256,100 C340,100 400,165 400,256 C400,340 335,405 250,405 C200,405 155,380 130,340 C175,360 230,355 270,325 C320,290 330,220 290,170 C265,140 220,125 180,135 C205,112 230,100 256,100 Z" fill="url(#lagoonTeal)"/>
    
    <!-- Deux vagues douces d'eaux calmes et reflets dorés -->
    <path d="M120,310 C165,280 215,310 260,290 C305,270 345,300 390,280 C360,330 300,350 240,345 C185,340 145,325 120,310 Z" fill="url(#oasisGold)" opacity="0.85"/>
    <path d="M150,340 C185,320 225,340 260,325 C295,310 330,330 365,315 C340,360 280,375 230,370 C185,365 160,350 150,340 Z" fill="url(#lagoonTeal)" opacity="0.7"/>

    <!-- Étoile du berger à 8 branches (l'accueil et l'orientation) -->
    <path d="M190,140 L195,165 L220,170 L195,175 L190,200 L185,175 L160,170 L185,165 Z" fill="url(#oasisGold)"/>
    <circle cx="190" cy="170" r="4" fill="#ffffff"/>
  </g>
</svg>
