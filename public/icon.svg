<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="100%" stop-color="#0E0D0B" />
    </linearGradient>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C85A32" />
      <stop offset="100%" stop-color="#A2482B" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7A6" />
      <stop offset="50%" stop-color="#C89B3C" />
      <stop offset="100%" stop-color="#996E20" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Sacred Outer Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.45" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.75" />

  <!-- Central Terracotta Solar Medallion -->
  <circle cx="256" cy="256" r="130" fill="url(#terracotta)" filter="url(#shadow)" stroke="url(#gold)" stroke-width="4" />

  <!-- Sacred Tree of Life / Astrolabe Axis -->
  <!-- Trunk & Roots -->
  <path d="M256 160 V 340 M230 330 Q 256 310 256 260 Q 256 310 282 330" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Canopy Branches -->
  <path d="M256 230 Q 220 200 200 220 Q 210 180 256 170 Q 302 180 312 220 Q 292 200 256 230 Z" fill="#FFFFFF" opacity="0.95" />
  
  <!-- Living Duo Points < > -->
  <circle cx="210" cy="256" r="12" fill="url(#gold)" />
  <circle cx="302" cy="256" r="12" fill="url(#gold)" />
  
  <!-- Golden Crown Star -->
  <polygon points="256,132 262,148 278,148 265,158 270,174 256,164 242,174 247,158 234,148 250,148" fill="url(#gold)" />
</svg>
