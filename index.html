    <script>
      (function() {
        // Intercept Vite HMR WebSocket in container preview environment to avoid connection closure errors
        const OrigWS = window.WebSocket;
        if (OrigWS) {
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || protocols === 'vite-ping') {
              const listeners = {};
              const fakeSocket = {
                readyState: 1,
                OPEN: 1,
                CLOSED: 3,
                CLOSING: 2,
                CONNECTING: 0,
                addEventListener: function(type, fn) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() { fn({ type: 'open' }); }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(f) { return f !== fn; });
                  }
                },
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() {
                  fakeSocket.readyState = 3;
                  if (listeners['close']) {
                    listeners['close'].forEach(function(f) { f({ type: 'close', wasClean: true }); });
                  }
                }
              };
              return fakeSocket;
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = OrigWS.CONNECTING;
          window.WebSocket.OPEN = OrigWS.OPEN;
          window.WebSocket.CLOSING = OrigWS.CLOSING;
          window.WebSocket.CLOSED = OrigWS.CLOSED;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && (
            (typeof event.reason.message === 'string' && event.reason.message.includes('WebSocket')) ||
            (typeof event.reason === 'string' && event.reason.includes('WebSocket'))
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.includes('WebSocket')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
